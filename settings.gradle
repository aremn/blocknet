pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'blocknet'

// NeoForge mod: the bot's body, runs on the server side.
include 'mod'

// Pathfinding (LGPL-3.0-or-later), extracted from Automatone.
include 'pathing'

// Crafting planner adapted from AE2 (LGPL-3.0-or-later).
include 'crafting'
